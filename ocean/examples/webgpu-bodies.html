<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyssal on WebGPU — drop a crate, cross two wakes</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e14; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 12px; left: 12px; color: #dfe9f2; font: 12px/1.6 ui-monospace, monospace; text-shadow: 0 1px 3px #000a; }
  #bar { position: fixed; bottom: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  #bar button { font: 11px ui-monospace, monospace; color: #dfe9f2; background: #10202eaa; border: 1px solid #2c4a60; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  #bar button:hover { background: #1a344a; }
  #bar .sep { flex-basis: 100%; height: 0; }
</style>

<canvas id="c"></canvas>
<div id="hud">two hulls cross — crates fall and float — <span id="backend">starting…</span></div>
<div id="bar"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
  "three/webgpu": "https://unpkg.com/three@0.185.1/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.185.1/build/three.tsl.js"
} }
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { createAbyssal } from '../src/gpu/abyssal.js';

// The public body API: any mesh can drop, float, splash, and leave a wake
// on the ONE shared field, so two hulls crossing mix foam and displacement
// the way Water Pro's overlapping generators do. The statue buoy in
// webgpu-ocean.html is the gap this page closes.

const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.add(new THREE.DirectionalLight(0xffffff, 3.0));
scene.add(new THREE.HemisphereLight(0x9fc4e8, 0x223344, 1.2));

const wood = new THREE.MeshStandardMaterial({ color: 0x8a6a3a, roughness: 0.72, metalness: 0.05 });
const crateMat = new THREE.MeshStandardMaterial({ color: 0xc4a36a, roughness: 0.65 });
const decoMat = new THREE.MeshStandardMaterial({ color: 0xd8451f, roughness: 0.45, metalness: 0.1 });

const hullGeo = new THREE.BoxGeometry(2.2, 0.65, 4.0);
const hullA = new THREE.Mesh(hullGeo, wood);
hullA.position.set(-14, 5, 6);
scene.add(hullA);

const hullB = new THREE.Mesh(hullGeo.clone(), wood);
hullB.position.set(14, 5, -6);
scene.add(hullB);

const crate = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.85, 0.85), crateMat);
crate.position.set(0, 14, -8);
scene.add(crate);

const crate2 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), crateMat);
crate2.position.set(3.5, 18, -3);
scene.add(crate2);

// Decoration only — same as today's buoy: in the scene, not a floating body.
const statue = new THREE.Mesh(new THREE.SphereGeometry(1.2, 28, 18), decoMat);
statue.position.set(9, 1.4, -16);
scene.add(statue);

const backend = new URLSearchParams(location.search).get('backend') || 'auto';
const abyssal = await createAbyssal({
  canvas,
  backend,
  preset: 'Tropical Noon',
  scene,
});
document.getElementById('backend').textContent =
  `running on ${abyssal.backend === 'webgpu' ? 'WebGPU' : 'WebGL2'}${abyssal.fellBack ? ' (no WebGPU here)' : ''}`;

const a = abyssal.bodies.add(hullA, {
  mass: 520, float: true, wake: { strength: 0.85, beam: 1.4, depth: 0.28 },
  splash: 'impact', hull: { push: 0.22, radius: 1.1, bow: 0.45 },
});
a.vel[0] = 5.2;

const b = abyssal.bodies.add(hullB, {
  mass: 520, float: true, wake: { strength: 0.85, beam: 1.4, depth: 0.28 },
  splash: 'impact', hull: { push: 0.22, radius: 1.1, bow: 0.45 },
});
b.vel[0] = -5.2;
b.heading = Math.PI;

abyssal.bodies.add(crate, {
  mass: 40, volume: 0.08, float: true, wake: true, splash: 'impact',
});
abyssal.bodies.add(crate2, {
  mass: 28, volume: 0.05, float: true, wake: true, splash: 'impact',
});
abyssal.bodies.add(statue, { float: false, wake: false });

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 40000);
let yaw = 0.55, pitch = -0.18, dist = 42, dragging = false, px = 0, py = 0;
canvas.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', (e) => { dragging = false; canvas.releasePointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - px) * 0.004;
  pitch = Math.max(-0.9, Math.min(0.55, pitch - (e.clientY - py) * 0.003));
  px = e.clientX; py = e.clientY;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist = Math.max(8, Math.min(300, dist * (1 + Math.sign(e.deltaY) * 0.12)));
}, { passive: false });

function placeCamera() {
  const h = Math.cos(pitch) * dist;
  camera.position.set(Math.sin(yaw) * h, 8 + Math.sin(-pitch) * dist, Math.cos(yaw) * h);
  camera.lookAt(0, 2, 0);
}

const bar = document.getElementById('bar');
const button = (label, fn) => {
  const el = document.createElement('button');
  el.textContent = label; el.onclick = fn;
  bar.appendChild(el);
};
for (const name of abyssal.presets) button(name, () => abyssal.setPreset(name));
bar.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));
for (const name of abyssal.cloudTypes) button(`☁ ${name}`, () => abyssal.setClouds(name));

const resize = () => {
  abyssal.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  abyssal.renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
};
resize();
addEventListener('resize', resize);

abyssal.renderer.setAnimationLoop(() => {
  placeCamera();
  abyssal.frame(camera);
});

window.abyssalExample = { renderer: abyssal.renderer, abyssal, scene, camera, bodies: abyssal.bodies };
</script>
