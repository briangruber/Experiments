<!doctype html>
<meta charset="utf-8">
<title>Abyssal — the wave runner mesh, in three</title>
<style>body{background:#0a0e14;color:#cfe4f5;font:12px/1.5 ui-monospace,monospace;padding:20px}pre{white-space:pre-wrap}canvas{margin-top:12px;border:1px solid #23384c}</style>
<pre id="out">running…</pre>
<canvas id="view" width="480" height="300"></canvas>

<!--
  The GLB the user authored, decoded into a THREE.BufferGeometry and shaded by
  the TSL craft material, over the real sky.

  What this asserts is what a screenshot cannot: that the mesh decoded to the
  right number of triangles at the right SIZE (a quantised model with the wrong
  scale is a perfectly clean render of a three-kilometre jet ski), that it
  actually covers pixels, that it is LIT rather than flat, and that the base
  colour atlas made it onto the hull - the livery is the one part that silently
  degrades to a solid colour if the JPEG decode or the UV convention is wrong,
  and solid colour still renders beautifully.

    node tools/run-probe.mjs prototypes/craft-tsl.html --shot shots/craft.png
-->

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
  "three/webgpu": "https://unpkg.com/three@0.185.1/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.185.1/build/three.tsl.js"
} }
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { readPixelsBottomUp } from './readback.js';
import { buildCraftGeometry, loadCraftTexture, setCraftTexture, craftFragment } from '../src/gpu/tsl/craft.js';
import { TslSky } from '../src/gpu/tsl/sky-driver.js';
import { newParams } from '../src/presets.js';
import { CRAFT_MESH } from '../demo/craftModel.js';
import { createDerived, derive } from '../src/derive.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 480), H = +(q.get('h') || 300);

const CRAFTV = CRAFT_MESH.verts, CRAFTT = CRAFT_MESH.tris;

const results = [];
const log = (name, ok, detail = '') => {
  results.push({ name, ok, detail });
  document.getElementById('out').textContent = results
    .map((r) => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}${r.detail ? '\n        ' + r.detail : ''}`).join('\n');
};

try {
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const renderer = new THREE.WebGPURenderer({ canvas, forceWebGL: true, antialias: false });
  await renderer.init();
  renderer.autoClear = false;

  // ---- the mesh -----------------------------------------------------------
  const LEN = 3.2;
  const { geometry, vertexCount, triangleCount } = buildCraftGeometry(LEN);
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const size = bb.max.clone().sub(bb.min);
  const longest = Math.max(size.x, size.y, size.z);
  log('mesh decoded', vertexCount === CRAFTV && triangleCount === CRAFTT,
      `${vertexCount} verts, ${triangleCount} tris (model says ${CRAFTV}/${CRAFTT})`);
  // A quantised model with the wrong scale renders perfectly and is the wrong
  // size, which no image check would catch.
  log('mesh is craft-sized', Math.abs(longest - LEN) < LEN * 0.02,
      `bounding box ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} m, ` +
      `longest ${longest.toFixed(3)} m for a ${LEN} m craft`);

  const tex = await loadCraftTexture(renderer);
  const textured = setCraftTexture(tex);
  log('base colour atlas decoded', textured,
      tex ? `${tex.image.width}x${tex.image.height}, flipY ${tex.flipY}, ${tex.colorSpace}` : 'decode failed');

  const material = new THREE.NodeMaterial();
  material.fragmentNode = craftFragment();
  material.side = THREE.DoubleSide;
  const mesh = new THREE.Mesh(geometry, material);

  // ---- scene --------------------------------------------------------------
  const params = newParams('Tropical Noon');
  const d = createDerived();
  derive(params, d);

  const scene = new THREE.Scene();
  scene.add(mesh);
  const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 60000);
  camera.position.set(2.6, 1.5, 3.4);
  camera.lookAt(0, 0.25, 0);

  const sky = new TslSky(renderer);
  sky.updateLUT(params, d.sunDir, 2);

  const target = new THREE.RenderTarget(W, H, {
    type: THREE.FloatType, format: THREE.RGBAFormat,
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true,
  });

  camera.updateMatrixWorld(true);
  const vp = new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  const ctx = {
    camPos: new Float32Array([camera.position.x, camera.position.y, camera.position.z]),
    viewProj: vp.elements,
    invViewProj: vp.clone().invert().elements,
    sunDir: d.sunDir, moonDir: d.moonDir, windVec3: d.windVec3, time: 12.0,
  };

  renderer.setRenderTarget(target);
  renderer.setClearColor(0x000000, 1);
  renderer.clear(true, true, false);
  renderer.render(scene, camera);        // craft first, writing depth
  sky.drawBackground(params, ctx);       // sky behind it
  renderer.setRenderTarget(null);

  const px = await readPixelsBottomUp(renderer, target, W, H);

  // ---- what is on the screen ----------------------------------------------
  // The craft occupies the middle of frame against a bright sky. Count pixels
  // that differ from their row's sky level - a silhouette test that does not
  // care what colour the hull is.
  let craftPx = 0, lit = 0, sum = 0, sum2 = 0;
  const hues = new Set();
  for (let y = 0; y < H; y++) {
    // sky reference: the leftmost column of this row (the craft is centred)
    const s = (y * W) * 4;
    const skyL = 0.2126 * px[s] + 0.7152 * px[s + 1] + 0.0722 * px[s + 2];
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const l = 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
      if (Math.abs(l - skyL) > 0.02 * Math.max(skyL, 0.05)) {
        craftPx++; sum += l; sum2 += l * l;
        if (l > 1e-4) lit++;
        // quantised hue, to see whether the surface carries a livery or one flat colour
        const mx = Math.max(px[i], px[i + 1], px[i + 2]) || 1e-6;
        hues.add(`${Math.round(px[i] / mx * 6)},${Math.round(px[i + 1] / mx * 6)},${Math.round(px[i + 2] / mx * 6)}`);
      }
    }
  }
  const mean = craftPx ? sum / craftPx : 0;
  const std = craftPx ? Math.sqrt(Math.max(sum2 / craftPx - mean * mean, 0)) : 0;

  log('the craft is on screen', craftPx > W * H * 0.02,
      `${craftPx} px, ${(craftPx / (W * H) * 100).toFixed(1)}% of frame`);
  log('it is lit, not a silhouette', mean > 0.01 && lit > craftPx * 0.9,
      `mean radiance ${mean.toFixed(4)}, ${lit} of ${craftPx} px above zero`);
  log('it is shaded, not flat', std > 0.01,
      `luminance std across the hull ${std.toFixed(4)}`);
  // A failed atlas decode leaves the fallback flat colour, which still renders
  // and still shades - only the number of distinct hues gives it away.
  log('the livery is on the hull', hues.size >= 6,
      `${hues.size} distinct quantised hues on the craft ` +
      `(a flat fallback colour under one sky gives very few)`);
  log('all finite', px.every(Number.isFinite));

  // preview
  const g = document.getElementById('view').getContext('2d');
  const img = g.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const y = H - 1 - Math.floor(i / W), x = i % W;
    const o = (y * W + x) * 4;
    for (let k = 0; k < 3; k++) {
      const v = Math.max(px[i * 4 + k], 0);
      img.data[o + k] = Math.min(255, 255 * Math.pow(v / (1 + v), 1 / 2.2));
    }
    img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
} catch (e) {
  log('craft render', false, String(e.stack || e.message || e).slice(0, 900));
}

window.probeResult = { results, allOk: results.every((r) => r.ok) };
</script>
