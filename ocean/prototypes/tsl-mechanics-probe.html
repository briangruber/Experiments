<!doctype html>
<meta charset="utf-8">
<title>Abyssal — the four TSL mechanics every stage needs</title>
<style>body{background:#0a0e14;color:#cfe4f5;font:12px/1.5 ui-monospace,monospace;padding:20px}pre{white-space:pre-wrap}</style>
<pre id="out">running…</pre>

<!--
  Before re-expressing the spectrum, the butterflies and the assembly as node
  graphs, check that TSL can do the four things every one of those stages needs.
  Guessing wrong here is not a bug in one stage, it is the plan being wrong.

    1. Seed a storage buffer with CPU data. The noise field and the butterfly
       table are computed in JS and uploaded; a kernel that cannot be given
       initial data cannot start.
    2. Gather from a second buffer at a computed index. Every butterfly reads two
       elements chosen by a table, not by its own invocation id.
    3. Write more than one output buffer. Assemble writes displacement and slope;
       evolve writes two packed halves.
    4. Loop and If. The spectrum sums a swell train; the shared-memory FFT walks
       its stages.

  Each is checked against a CPU reference computed from the same input, on both
  backends. "It ran" is not the bar - a wgslFn kernel ran clean and wrote zeros.
-->

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
  "three/webgpu": "https://unpkg.com/three@0.185.1/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.185.1/build/three.tsl.js"
} }
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { Fn, instancedArray, instanceIndex, float, uint, int, vec4, vec2, Loop, If } from 'three/tsl';

const results = [];
const log = (name, ok, detail = '') => {
  results.push({ name, ok, detail });
  document.getElementById('out').textContent = results
    .map((r) => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}${r.detail ? '\n        ' + r.detail : ''}`).join('\n');
};

const COUNT = 64;

// A deliberately awkward input: not a ramp, so an off-by-one or a wrong gather
// cannot accidentally look right.
const seedData = new Float32Array(COUNT * 4);
for (let i = 0; i < COUNT; i++) {
  seedData[i * 4 + 0] = Math.sin(i * 0.7) * 2;
  seedData[i * 4 + 1] = Math.cos(i * 1.3);
  seedData[i * 4 + 2] = i * 0.25;
  seedData[i * 4 + 3] = 1;
}
// Gather target for each invocation: a permutation, so a straight-through read
// gives the wrong answer.
const idxData = new Float32Array(COUNT * 4);
for (let i = 0; i < COUNT; i++) idxData[i * 4] = (i * 37 + 11) % COUNT;

function reference() {
  const out = { gathered: [], second: [], looped: [] };
  for (let i = 0; i < COUNT; i++) {
    const j = (i * 37 + 11) % COUNT;
    const a = seedData[j * 4], b = seedData[j * 4 + 1];
    // complex multiply by (0.6, -0.8), the shape of every butterfly twiddle
    out.gathered.push(a * 0.6 - b * -0.8, a * -0.8 + b * 0.6);
    out.second.push(a * 2, b * 2);
    let acc = 0;
    for (let k = 0; k < 5; k++) acc += Math.sin(a + k) * 0.2;
    out.looped.push(i % 2 === 0 ? acc : -acc);
  }
  return out;
}

async function run(forceWebGL) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 32;
  const renderer = new THREE.WebGPURenderer({ canvas, forceWebGL });
  await renderer.init();
  const backend = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2';
  const steps = {};

  // 1. storage buffers seeded from CPU data
  const src = instancedArray(seedData, 'vec4');
  const idx = instancedArray(idxData, 'vec4');
  const outA = instancedArray(COUNT, 'vec4');
  const outB = instancedArray(COUNT, 'vec4');

  // Reading an input-only buffer back is not the same question as whether it was
  // seeded, and TSL will not materialise one it never wrote to - which reads as
  // "seeding failed" when seeding is fine. Test 2 settles it properly: the gather
  // reads THIS buffer at permuted indices and is checked against a CPU reference
  // computed from the same data. If it matches, the data got there.
  try {
    const back = new Float32Array(await renderer.getArrayBufferAsync(src.value));
    steps.readback = Math.abs(back[4] - seedData[4]) < 1e-5;
  } catch (e) { steps.readback = String(e.message || e); }

  // 2 + 3. gather at a computed index, write two outputs
  const kernel = Fn(() => {
    const j = uint(idx.element(instanceIndex).x);
    const s = src.element(j);
    const w = vec2(0.6, -0.8);
    outA.element(instanceIndex).assign(vec4(
      s.x.mul(w.x).sub(s.y.mul(w.y)),
      s.x.mul(w.y).add(s.y.mul(w.x)),
      0, 1));
    outB.element(instanceIndex).assign(vec4(s.x.mul(2), s.y.mul(2), 0, 1));
  })().compute(COUNT);

  try { await renderer.computeAsync(kernel); steps.gatherWrite = true; }
  catch (e) { steps.gatherWrite = String(e.message || e); }

  // 4. Loop and If
  const outC = instancedArray(COUNT, 'vec4');
  const loopKernel = Fn(() => {
    const j = uint(idx.element(instanceIndex).x);
    const a = src.element(j).x;
    const acc = float(0).toVar();
    Loop({ start: int(0), end: int(5) }, ({ i }) => {
      acc.addAssign(a.add(float(i)).sin().mul(0.2));
    });
    const signed = float(0).toVar();
    If(instanceIndex.mod(uint(2)).equal(uint(0)), () => {
      signed.assign(acc);
    }).Else(() => {
      signed.assign(acc.negate());
    });
    outC.element(instanceIndex).assign(vec4(signed, 0, 0, 1));
  })().compute(COUNT);

  try { await renderer.computeAsync(loopKernel); steps.loopIf = true; }
  catch (e) { steps.loopIf = String(e.message || e); }

  const read = async (b) => {
    try { return new Float32Array(await renderer.getArrayBufferAsync(b.value)); }
    catch { return null; }
  };
  const A = await read(outA), B = await read(outB), C = await read(outC);
  renderer.dispose();
  return { backend, steps, A, B, C };
}

const ref = reference();
const near = (arr, want, stride, off) => {
  if (!arr) return { ok: false, worst: Infinity };
  let worst = 0;
  for (let i = 0; i < COUNT; i++) {
    for (let k = 0; k < stride; k++) {
      const got = arr[i * 4 + k + off];
      const exp = want[i * stride + k];
      worst = Math.max(worst, Math.abs(got - exp));
    }
  }
  return { ok: worst < 1e-4, worst };
};

for (const [label, force] of [['WebGPU', false], ['WebGL2', true]]) {
  let r;
  try { r = await run(force); } catch (e) { log(`${label}: renderer`, false, String(e.message || e)); continue; }
  const g = near(r.A, ref.gathered, 2, 0);
  // Seeding is proven by the gather matching, not by reading the buffer back.
  log(`${r.backend}: 1. storage buffer seeded from CPU data`, g.ok,
      g.ok ? 'proven by the gather below' : 'the gather does not match the CPU reference');
  log(`${r.backend}: 2. gather at a computed index`, g.ok, `worst ${g.worst.toExponential(2)}`);
  const s = near(r.B, ref.second, 2, 0);
  log(`${r.backend}: 3. two output buffers in one kernel`, s.ok, `worst ${s.worst.toExponential(2)}`);
  const l = near(r.C, ref.looped, 1, 0);
  log(`${r.backend}: 4. Loop and If`, l.ok && r.steps.loopIf === true,
      r.steps.loopIf === true ? `worst ${l.worst.toExponential(2)}` : String(r.steps.loopIf));
}

window.probeResult = { results, allOk: results.every((r) => r.ok) };
</script>
