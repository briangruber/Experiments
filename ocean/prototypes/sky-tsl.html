<!doctype html>
<meta charset="utf-8">
<title>Abyssal — the TSL sky, at the golden's rig</title>
<style>body{background:#0a0e14;color:#cfe4f5;font:12px/1.5 ui-monospace,monospace;padding:20px}pre{white-space:pre-wrap}canvas{margin-top:12px;border:1px solid #23384c;image-rendering:pixelated}</style>
<pre id="out">running…</pre>
<canvas id="view" width="160" height="100"></canvas>

<!--
  The same image prototypes/sky-golden.html renders through the shipping WebGL2
  path, rendered instead through the TSL node graphs, at the same camera, the
  same preset and the same time, in linear HDR before any tonemapping.

  Emits the identical fingerprint shape, so:

    node tools/run-probe.mjs prototypes/sky-tsl.html --save test/out/sky-tsl.json
    node tools/compare-image.mjs test/golden/sky.json test/out/sky-tsl.json

  Compiling was settled by prototypes/tsl-sky-compile-probe.html. This is the
  question that one could not answer: whether the graphs compute the same sky.
  A mirrored LUT, a dropped scattering term or a phase function off by a
  constant all compile perfectly.

  ?backend=webgl (default) forces the WebGL2 backend; ?backend=webgpu uses the
  real WebGPU one. Both run here: WebGPU is present as a SwiftShader adapter,
  and prototypes/webgpu-shim.js works around the one incompatibility that used
  to block it (three r185 passes swizzle:'rgba' as a string where Chromium 141
  wants a GPUTextureComponentSwizzle dictionary - 'rgba' is the identity, so the
  shim drops a no-op). Both backends are verified against the same reference.
-->

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
  "three/webgpu": "https://unpkg.com/three@0.185.1/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.185.1/build/three.tsl.js"
} }
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { installWebGPUSwizzleShim } from './webgpu-shim.js';
import { readPixelsBottomUp } from './readback.js';
import { TslSky } from '../src/gpu/tsl/sky-driver.js';
import { newParams } from '../src/presets.js';
import { createDerived, derive } from '../src/derive.js';
import { perspective, lookAt, mul, invert, mat4, v3, DEG } from '../src/math.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 160), H = +(q.get('h') || 100);
const PRESET = q.get('preset') || 'Golden Hour Swell';
const FORCE_WEBGL = (q.get('backend') || 'webgl') === 'webgl';

installWebGPUSwizzleShim();

const results = [];
const log = (name, ok, detail = '') => {
  results.push({ name, ok, detail });
  document.getElementById('out').textContent = results
    .map((r) => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}${r.detail ? '\n        ' + r.detail : ''}`).join('\n');
};

// Byte-for-byte the rig in prototypes/sky-golden.html. If these drift apart the
// comparison silently measures two different views, so compare-image.mjs checks
// the rig too and refuses.
const RIG = {
  pos: [0, 12, 0],
  yaw: -0.6, pitch: -0.02,
  fov: 44, near: 0.1, far: 60000,
  time: 12.0,
};

let fingerprint = null;
let backend = '?';
try {
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const renderer = new THREE.WebGPURenderer({ canvas, forceWebGL: FORCE_WEBGL, antialias: false });
  await renderer.init();
  backend = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2';

  const params = newParams(PRESET);
  // ?set=cirrus:0,cloudCoverage:0 - see the note in prototypes/sky-golden.html.
  for (const kv of (q.get('set') || '').split(',').filter(Boolean)) {
    const [k, v] = kv.split(':');
    params[k] = +v;
  }
  const d = createDerived();
  derive(params, d);

  const sky = new TslSky(renderer);
  sky.updateLUT(params, d.sunDir, Math.max(RIG.pos[1], 1));

  const target = new THREE.RenderTarget(W, H, {
    type: THREE.FloatType, format: THREE.RGBAFormat,
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    depthBuffer: false,
  });

  // Same matrix convention as prototypes/sky-golden.html and demo/camera.js.
  const targetPt = v3(
    RIG.pos[0] + Math.cos(RIG.pitch) * Math.sin(RIG.yaw),
    RIG.pos[1] + Math.sin(RIG.pitch),
    RIG.pos[2] - Math.cos(RIG.pitch) * Math.cos(RIG.yaw),
  );
  const view = lookAt(new Float32Array(RIG.pos), targetPt, v3(0, 1, 0), mat4());
  const proj = perspective(RIG.fov * DEG, W / H, RIG.near, RIG.far, mat4());
  const viewProj = mul(proj, view, mat4());
  const invViewProj = invert(viewProj, mat4());

  renderer.setRenderTarget(target);
  sky.drawBackground(params, {
    camPos: new Float32Array(RIG.pos),
    invViewProj, viewProj,
    sunDir: d.sunDir, moonDir: d.moonDir, windVec3: d.windVec3,
    time: RIG.time,
  });
  renderer.setRenderTarget(null);

  // Bottom-up on both backends - see readback.js. The two disagree and the
  // difference does not move the statistics, only every individual pixel.
  const px = await readPixelsBottomUp(renderer, target, W, H);

  const view2d = document.getElementById('view').getContext('2d');
  const img = view2d.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    for (let k = 0; k < 3; k++) {
      const v = px[i * 4 + k];
      img.data[i * 4 + k] = Math.min(255, 255 * Math.pow(Math.max(v, 0) / (1 + Math.max(v, 0)), 1 / 2.2));
    }
    img.data[i * 4 + 3] = 255;
  }
  const flipped = view2d.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    const src = (H - 1 - y) * W * 4;
    flipped.data.set(img.data.subarray(src, src + W * 4), y * W * 4);
  }
  view2d.putImageData(flipped, 0, 0);

  let sum = 0, sum2 = 0, min = Infinity, max = -Infinity;
  for (let i = 0; i < W * H; i++) {
    const l = 0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2];
    sum += l; sum2 += l * l;
    if (l < min) min = l; if (l > max) max = l;
  }
  const n = W * H;
  const mean = sum / n;

  fingerprint = {
    config: { W, H, preset: PRESET, rig: RIG },
    stats: {
      mean: +mean.toFixed(6),
      rms: +Math.sqrt(sum2 / n).toFixed(6),
      min: +min.toFixed(6), max: +max.toFixed(6),
    },
    pixels: Array.from(px).map((v) => +v.toFixed(4)),
  };

  log(`${backend}: sky rendered`, mean > 1e-4, `mean radiance ${mean.toFixed(4)}, peak ${max.toFixed(3)}`);
  log(`${backend}: not uniform`, Math.sqrt(Math.max(sum2 / n - mean * mean, 0)) > 1e-3,
      `std ${Math.sqrt(Math.max(sum2 / n - mean * mean, 0)).toFixed(4)}`);
  log(`${backend}: all finite`, px.every(Number.isFinite));
} catch (e) {
  log(`${backend}: render the TSL sky`, false, String(e.stack || e.message || e).slice(0, 900));
}

window.probeResult = { results, allOk: results.every((r) => r.ok), fingerprint };
</script>
