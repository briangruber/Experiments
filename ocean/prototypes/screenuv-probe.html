<!doctype html>
<meta charset="utf-8">
<title>Abyssal — which way is up in screenUV, and on which backend?</title>
<style>body{background:#0a0e14;color:#cfe4f5;font:12px/1.5 ui-monospace,monospace;padding:20px}pre{white-space:pre-wrap}</style>
<pre id="out">running…</pre>

<!--
  Every fullscreen pass left in the port - the sky background, the post chain,
  the water's screen-space reflection fetch - turns a screen position into a ray
  or a texture fetch. Get v upside down and nothing errors: the sky renders,
  smoothly, with the horizon in the wrong half of the frame.

  The sky LUT header already established that uv() on a QuadMesh puts v = 0 at
  the NDC *top*, which is the opposite of the FS_VERT convention the GLSL uses
  (vUv = a_pos*0.5+0.5, so v = 0 at the bottom). screenUV is a different node
  with its own definition, and TextureNode.setupUV flips v on GLSL but not on
  WGSL - so the answer can differ per backend, which is the case that actually
  hurts, because it renders correctly in whichever one you happened to test.

  So: write the coordinate itself into a float target and read it back. Row 0 of
  a readback is the BOTTOM row of the image on both backends (readRenderTarget
  follows readPixels), so "v at row 0" answers it directly:

     v ~ 0 at row 0  ->  v = 0 at the bottom  ->  matches FS_VERT, use as-is
     v ~ 1 at row 0  ->  v = 0 at the top     ->  flip before use
-->

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
  "three/webgpu": "https://unpkg.com/three@0.185.1/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.185.1/build/three.tsl.js"
} }
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import { vec4, screenUV, uv, screenCoordinate } from 'three/tsl';

const results = [];
const log = (name, ok, detail = '') => {
  results.push({ name, ok, detail });
  document.getElementById('out').textContent = results
    .map((r) => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}${r.detail ? '\n        ' + r.detail : ''}`).join('\n');
};

const N = 8;   // 8x8 target: row 0 and row N-1 are unambiguous

async function run(forceWebGL) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = N;
  const renderer = new THREE.WebGPURenderer({ canvas, forceWebGL, antialias: false });
  await renderer.init();
  const backend = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2';

  const out = {};
  // Both candidates in one draw: screenUV in rg, QuadMesh uv() in ba. Comparing
  // them in the same image removes any doubt about the readback's own order.
  for (const [name, node] of Object.entries({
    both: vec4(screenUV.x, screenUV.y, uv().x, uv().y),
    fragcoord: vec4(screenCoordinate.x, screenCoordinate.y, 0, 1),
  })) {
    try {
      const mat = new THREE.MeshBasicNodeMaterial();
      mat.fragmentNode = node;
      const scene = new THREE.Scene();
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
      quad.frustumCulled = false;
      scene.add(quad);
      const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const target = new THREE.RenderTarget(N, N, {
        type: THREE.FloatType, format: THREE.RGBAFormat,
        minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      });
      renderer.setRenderTarget(target);
      await renderer.renderAsync(scene, cam);
      renderer.setRenderTarget(null);
      out[name] = await renderer.readRenderTargetPixelsAsync(target, 0, 0, N, N);
    } catch (e) {
      const msg = String(e.message || e);
      out[name] = /swizzle|GPUTextureViewDescriptor/.test(msg) ? 'sandbox-render-bug' : msg.slice(0, 300);
    }
  }
  renderer.dispose();
  return { backend, out };
}

for (const [label, force] of [['WebGPU', false], ['WebGL2', true]]) {
  let r;
  try { r = await run(force); } catch (e) { log(`${label}: renderer`, false, String(e.message || e)); continue; }

  const px = r.out.both;
  if (typeof px === 'string') {
    log(`${r.backend}: screenUV orientation`, px === 'sandbox-render-bug',
        px === 'sandbox-render-bug' ? 'render blocked by the sandbox Chromium bug — cannot measure here' : px);
    continue;
  }

  // Row 0 of the readback, first texel; and row N-1, first texel.
  const at = (row) => ({
    sU: px[(row * N) * 4], sV: px[(row * N) * 4 + 1],
    qU: px[(row * N) * 4 + 2], qV: px[(row * N) * 4 + 3],
  });
  const lo = at(0), hi = at(N - 1);

  const screenVAtBottom = lo.sV;
  const quadVAtBottom = lo.qV;
  const screenYUp = screenVAtBottom < 0.5;
  const quadYUp = quadVAtBottom < 0.5;

  log(`${r.backend}: screenUV.y at the bottom row = ${screenVAtBottom.toFixed(3)}`, true,
      `${screenYUp ? 'v=0 at the BOTTOM — matches FS_VERT, use as-is' : 'v=0 at the TOP — must be flipped'}` +
      `  (top row ${hi.sV.toFixed(3)})`);
  log(`${r.backend}: uv() at the bottom row = ${quadVAtBottom.toFixed(3)}`, true,
      `${quadYUp ? 'v=0 at the BOTTOM' : 'v=0 at the TOP'}  (top row ${hi.qV.toFixed(3)})`);

  // x must be left-to-right in both, or the whole reasoning above is unsafe.
  const right = px[((0) * N + (N - 1)) * 4];
  log(`${r.backend}: screenUV.x increases to the right`, right > lo.sU,
      `left ${lo.sU.toFixed(3)} -> right ${right.toFixed(3)}`);

  window[`orient_${r.backend}`] = { screenYUp, quadYUp, lo, hi };
}

// The case that silently breaks a port: the two backends disagreeing.
const a = window.orient_WebGPU, b = window.orient_WebGL2;
if (a && b) {
  log('the two backends agree on screenUV.y', a.screenYUp === b.screenYUp,
      a.screenYUp === b.screenYUp ? 'same convention on both — one code path is safe'
        : 'THEY DISAGREE — a fullscreen pass written against one is upside down on the other');
}

window.probeResult = { results, allOk: results.every((r) => r.ok) };
</script>
