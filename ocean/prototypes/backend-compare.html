<meta charset="utf-8">
<title>Abyssal — WebGPU vs WebGL2 wave simulation</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#070b11; color:#d6e4f0; font:14px/1.6 ui-sans-serif,system-ui,sans-serif; padding:26px; }
  main { max-width:900px; margin:0 auto; }
  h1 { font-size:21px; margin:0 0 6px; }
  h2 { font-size:14px; margin:26px 0 8px; color:#9fc9e8; text-transform:uppercase; letter-spacing:.05em; }
  p.sub { color:#7f95ab; margin:0 0 20px; }
  button { background:#1b4b6b; color:#eaf4fb; border:1px solid #2f6f96; border-radius:7px; padding:9px 18px; cursor:pointer; font:14px ui-sans-serif,system-ui,sans-serif; }
  button:hover { background:#235f86; } button:disabled { opacity:.5; cursor:default; }
  #picker { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #picker button { background:#101d2b; border-color:#24405a; }
  #picker button.sel { background:#1b4b6b; border-color:#2f6f96; }
  table { border-collapse:collapse; width:100%; margin:6px 0; }
  th,td { text-align:left; padding:5px 9px; border-bottom:1px solid #1c2b3a; font-variant-numeric:tabular-nums; font-size:13px; }
  th { color:#8ba3b8; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }
  td.num { text-align:right; font-family:ui-monospace,monospace; }
  .ok { color:#6ee7a8; } .bad { color:#ff9b8a; } .note { color:#7f95ab; font-size:13px; }
  code { font-family:ui-monospace,monospace; font-size:12.5px; color:#9fc9e8; }
  #verdict { margin-top:8px; padding:14px 16px; border-radius:8px; border:1px solid #2a3f55; background:#0d1724; }
  .fields { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; }
  .field { text-align:center; }
  .field canvas { width:210px; height:210px; image-rendering:pixelated; border:1px solid #23384c; border-radius:6px; display:block; background:#050a10; }
  .field span { display:block; margin-top:5px; font-size:11.5px; color:#8ba3b8; }
  #status { color:#7f95ab; font-size:13px; margin-left:10px; }
</style>

<main>
<h1>The wave simulation, on both backends</h1>
<p class="sub">
  Runs Abyssal's FFT ocean twice on this machine — once as WebGL2 fragment
  passes, once as WebGPU compute — and diffs the displacement fields. Everything
  is local; nothing is uploaded.
</p>

<div id="picker">
  <button id="run-both" class="sel">Run both and compare</button>
  <button id="run-gpu">WebGPU only</button>
  <button id="run-gl">WebGL2 only</button>
  <span id="status"></span>
</div>

<div id="out"></div>
</main>

<script type="module" src="./prototypes/backend-compare.js"></script>
