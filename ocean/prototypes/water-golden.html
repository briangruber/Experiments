<!doctype html>
<meta charset="utf-8">
<title>Abyssal — water surface reference image</title>
<style>body{background:#0a0e14;color:#cfe4f5;font:12px/1.5 ui-monospace,monospace;padding:20px}pre{white-space:pre-wrap}canvas{margin-top:12px;border:1px solid #23384c;image-rendering:pixelated}</style>
<pre id="out">running…</pre>
<canvas id="view" width="160" height="100"></canvas>

<!--
  The sea as the shipping WebGL2 renderer draws it, at a fixed camera, a fixed
  preset and a fixed number of simulation steps, in linear HDR before any
  tonemapping. This is what the TSL water port has to reproduce.

  Everything that could drift is pinned:

    the simulation   fixed seed, fixed fftSize, fixed dt, fixed step count. The
                     wave field is reproducible to the bit (prototypes/ocean-golden.html
                     is the same setup and fingerprints the field itself).
    the grid         gridScale 1 and the preset's own radial/angular counts, so
                     the same vertices land in the same places.
    the camera       no handheld, no bob, no time-varying rig.
    the sky          baked from the same params, because the water reflects it
                     and a LUT difference would read as a water difference.

  HDR on purpose, for the reason given in prototypes/sky-golden.html: comparing
  after the post chain folds exposure and the tonemap into the measurement.

  The sky background is drawn FIRST, so the frame contains sea below the horizon
  and sky above it exactly as the app composes them - which also means this one
  reference covers the water/sky seam, where a horizon-bend or curvature error
  would show up and a water-only render would hide it.

    node tools/run-probe.mjs prototypes/water-golden.html --save test/golden/water.json
-->

<script type="module">
import { getContext, texture2D, framebuffer, Blitter } from '../src/gl.js';
import { Ocean, DEFAULT_CASCADES } from '../src/ocean.js';
import { WaterSurface } from '../src/water.js';
import { Sky } from '../src/sky.js';
import { newParams } from '../src/presets.js';
import { createDerived, derive } from '../src/derive.js';
import { perspective, lookAt, mul, invert, mat4, v3, DEG } from '../src/math.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 160), H = +(q.get('h') || 100);
const PRESET = q.get('preset') || 'Golden Hour Swell';
const SEED = +(q.get('seed') || 1337);
const N = +(q.get('n') || 128);
const STEPS = +(q.get('steps') || 8);
const DT = 1 / 60;

const results = [];
const log = (name, ok, detail = '') => {
  results.push({ name, ok, detail });
  document.getElementById('out').textContent = results
    .map((r) => `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}${r.detail ? '\n        ' + r.detail : ''}`).join('\n');
};

// Shared with prototypes/water-tsl.html. compare-image.mjs checks the rig, so
// the two cannot silently drift into rendering different views.
const RIG = {
  pos: [0, 12, 0],
  yaw: -0.6, pitch: -0.02,
  fov: 44, near: 0.1, far: 60000,
  time: 12.0,
};
// Rig overrides for A/B hunts away from the golden view (?camy=30&pitch=-0.01).
// Defaults untouched; compare-image checks the rig and refuses a mismatch.
if (q.get('camy')) RIG.pos[1] = +q.get('camy');
if (q.get('pitch')) RIG.pitch = +q.get('pitch');
if (q.get('fov')) RIG.fov = +q.get('fov');

let fingerprint = null;
try {
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const gl = getContext(canvas, {});
  const blit = new Blitter(gl);

  const params = newParams(PRESET);
  params.seed = SEED;
  params.fftSize = N;
  params.gridScale = 1;
  for (const kv of (q.get('set') || '').split(',').filter(Boolean)) {
    const [k, v] = kv.split(':');
    params[k] = +v;
  }
  const d = createDerived();
  derive(params, d);

  const ocean = new Ocean(gl, { size: N, cascades: DEFAULT_CASCADES });
  ocean.setSeed(SEED);
  ocean.buildSpectrum(params);
  for (let i = 0; i < STEPS; i++) ocean.update(DT, params);

  const sky = new Sky(gl, blit);
  sky.updateLUT(params, d.sunDir, Math.max(RIG.pos[1], 1));

  const water = new WaterSurface(gl, params, { output: 'hdr' });

  const target = v3(
    RIG.pos[0] + Math.cos(RIG.pitch) * Math.sin(RIG.yaw),
    RIG.pos[1] + Math.sin(RIG.pitch),
    RIG.pos[2] - Math.cos(RIG.pitch) * Math.cos(RIG.yaw),
  );
  const view = lookAt(new Float32Array(RIG.pos), target, v3(0, 1, 0), mat4());
  const proj = perspective(RIG.fov * DEG, W / H, RIG.near, RIG.far, mat4());
  const viewProj = mul(proj, view, mat4());
  const invViewProj = invert(viewProj, mat4());

  const hdr = texture2D(gl, {
    width: W, height: H, internalFormat: gl.RGBA32F, format: gl.RGBA, type: gl.FLOAT,
    filter: gl.NEAREST, wrap: gl.CLAMP_TO_EDGE,
  });
  // A depth attachment is required: the sky background is depth-tested against
  // the sea, which is the whole reason it is cheap.
  const depth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, W, H);
  const fbo = framebuffer(gl, [hdr]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1);
  gl.clearDepth(1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const ctx = {
    camPos: new Float32Array(RIG.pos),
    viewProj, invViewProj,
    sunDir: d.sunDir, moonDir: d.moonDir, windVec3: d.windVec3,
    time: RIG.time,
  };

  water.render(params, ctx, ocean, sky);
  sky.drawBackground(params, ctx);

  const px = new Float32Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, px);

  const view2d = document.getElementById('view').getContext('2d');
  const img = view2d.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    for (let k = 0; k < 3; k++) {
      const v = Math.max(px[i * 4 + k], 0);
      img.data[i * 4 + k] = Math.min(255, 255 * Math.pow(v / (1 + v), 1 / 2.2));
    }
    img.data[i * 4 + 3] = 255;
  }
  const flipped = view2d.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    const src = (H - 1 - y) * W * 4;
    flipped.data.set(img.data.subarray(src, src + W * 4), y * W * 4);
  }
  view2d.putImageData(flipped, 0, 0);

  let sum = 0, sum2 = 0, min = Infinity, max = -Infinity;
  for (let i = 0; i < W * H; i++) {
    const l = 0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2];
    sum += l; sum2 += l * l;
    if (l < min) min = l; if (l > max) max = l;
  }
  const n = W * H;
  const mean = sum / n;

  fingerprint = {
    config: { W, H, preset: PRESET, rig: RIG, seed: SEED, n: N, steps: STEPS },
    stats: {
      mean: +mean.toFixed(6),
      rms: +Math.sqrt(sum2 / n).toFixed(6),
      min: +min.toFixed(6), max: +max.toFixed(6),
    },
    pixels: Array.from(px).map((v) => +v.toFixed(4)),
  };

  // The sea has to actually be in frame, or this reference is of an empty sky.
  // Below the horizon row the image must be substantially brighter than black
  // and must vary - a flat region there means the grid never drew.
  let seaSum = 0, seaVar = 0, seaN = 0;
  for (let y = 0; y < 45; y++) {
    for (let x = 0; x < W; x++) {
      const l = 0.2126 * px[(y * W + x) * 4] + 0.7152 * px[(y * W + x) * 4 + 1] + 0.0722 * px[(y * W + x) * 4 + 2];
      seaSum += l; seaVar += l * l; seaN++;
    }
  }
  const seaMean = seaSum / seaN;
  const seaStd = Math.sqrt(Math.max(seaVar / seaN - seaMean * seaMean, 0));

  log('water rendered', mean > 1e-4, `mean radiance ${mean.toFixed(4)}, peak ${max.toFixed(3)}`);
  log('sea is in frame and not flat', seaMean > 1e-3 && seaStd > 1e-3,
      `lower-frame mean ${seaMean.toFixed(4)}, std ${seaStd.toFixed(4)}`);
  log('all finite', px.every(Number.isFinite));
} catch (e) {
  log('render water reference', false, String(e.stack || e.message || e).slice(0, 800));
}

window.probeResult = { results, allOk: results.every((r) => r.ok), fingerprint };
</script>
