<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abyssal Ocean</title>
<!-- The full settings panel is the classic demo's, verbatim: demo/ui.js builds
     it and demo/ui.css styles it. The bundler inlines that stylesheet at the
     marker below. It comes BEFORE this page's own style block on purpose, so
     wherever the two disagree (body, canvas, palette) the instrument panel's
     rules win by document order. -->
<style>/*__UI_CSS__*/</style>
<style>
  /* Single theme by commitment, not omission: this page is a full-bleed night
     sea. A light variant would mean painting a panel for a ground that does not
     exist here. So there is no media query and no theme stamp - but every colour
     is painted explicitly and body carries its own background, so the page holds
     whatever ground the host puts behind it. */
  :root {
    --abyss:  #060d14;   /* panel ground - deep water */
    --hull:   #0d1a25;   /* raised control ground */
    --hull-2: #12222f;   /* hover */
    --rule:   #1d3243;   /* hairlines, blue-biased rather than grey */
    --spume:  #dceaf2;   /* primary text - cold foam */
    --haze:   #7b9cb2;   /* secondary text - sea haze */
    --dim:    #4d6c82;   /* tertiary */
    --glint:  #52d6c4;   /* accent: light through a wave face. Live state only. */
    --amber:  #e8b455;   /* semantic warning. Not the accent. */
    --coral:  #e8735a;   /* semantic error */

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--abyss);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  #view {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;         /* drag-to-look, not scroll */
    cursor: grab;
    /* Promote the canvas to its own compositor layer. On iOS Safari the WebGPU
       canvas stayed blank until a DOM change (collapsing the panel) forced a
       re-composite; pinning it to a layer is the standard nudge for exactly that
       class of bug. Unverifiable from where this is written - iOS has no
       headless - so it is an attempt, stated as one. */
    transform: translateZ(0);
  }
  #view:active { cursor: grabbing; }

  /* ---- the instrument panel ---------------------------------------------- */

  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    display: flex; flex-direction: column; gap: 10px;
    width: 15.5rem; max-width: calc(100vw - 28px);
    padding: 12px 13px 11px;
    font: 400 12px/1.5 var(--mono);
    color: var(--spume);
    /* No backdrop-filter. It looked better and it cost the canvas: over a WebGPU
       canvas, Chromium would not composite the render until the panel was
       collapsed - the page came up blank and the sea only appeared once the
       filtered element shrank. It also keeps the compositor busy forever, which
       is why a screenshot of this page never reaches a stable frame. A solid
       ground is legible on any sea state and does not touch the canvas. */
    background: rgba(6, 13, 20, 0.93);
    border: 1px solid var(--rule);
    border-radius: 10px;
  }
  #hud[data-collapsed="true"] > :not(#hud-head) { display: none; }
  #hud[data-collapsed="true"] { gap: 0; padding-bottom: 12px; }

  #hud-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 {
    margin: 0;
    font: 600 10px/1 var(--mono);
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--haze);
  }
  #toggle {
    font: 600 11px/1 var(--mono);
    color: var(--dim); background: none; border: 0; padding: 2px 4px;
    cursor: pointer; border-radius: 4px;
  }
  #toggle:hover { color: var(--spume); }

  #hint {
    margin: 0;
    font: 400 11px/1.45 var(--sans);
    color: var(--dim);
  }
  /* The thumb controls, shown only where there is a thumb and only while
     riding - the pointer query is the same one src/presets.js uses to decide
     this is a handheld. */
  #hint-touch { display: none; margin: 0; font: 400 11px/1.45 var(--sans); color: var(--haze); }
  @media (pointer: coarse) {
    body.riding #hint-touch, body.flying #hint-touch { display: block; }
  }

  /* The segmented control shows what was REQUESTED. What is actually running is
     the status line below - the two differ whenever a fallback fires, and this
     app exists to exercise exactly that, so the difference is shown, not hidden. */
  #backend { display: flex; gap: 4px; }
  #backend button {
    flex: 1;
    font: 500 11px/1 var(--mono);
    color: var(--haze);
    background: var(--hull);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 6px 4px;
    cursor: pointer;
    -webkit-appearance: none;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  #backend button:hover { background: var(--hull-2); color: var(--spume); }
  #backend button[aria-pressed="true"] {
    color: var(--abyss);
    background: var(--glint);
    border-color: var(--glint);
  }

  /* The ride pair. Same construction as the backend group, but Ride carries the
     accent when it is live, because "am I riding?" is state and not a request. */
  #ride-row { display: flex; gap: 4px; }
  #ride-row button {
    font: 500 11px/1 var(--mono);
    color: var(--spume);
    background: var(--hull);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 8px 4px;
    cursor: pointer;
    -webkit-appearance: none;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  #btn-ride, #btn-fly { flex: 3; }
  #btn-view { flex: 2; color: var(--haze); }
  #ride-row button:hover { background: var(--hull-2); color: var(--spume); }
  #btn-ride[aria-pressed="true"], #btn-fly[aria-pressed="true"] {
    color: var(--abyss);
    background: var(--glint);
    border-color: var(--glint);
  }
  @media (prefers-reduced-motion: reduce) {
    #ride-row button { transition: none; }
  }

  select {
    font: 400 11px/1 var(--mono);
    width: 100%;
    color: var(--spume);
    background: var(--hull);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 8px;
    -webkit-appearance: none; appearance: none;
    cursor: pointer;
  }
  select:hover { background: var(--hull-2); }

  #settings-btn {
    font: 400 11px/1 var(--mono);
    width: 100%;
    color: var(--spume);
    background: var(--hull);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 8px;
    text-align: left;
    cursor: pointer;
  }
  #settings-btn:hover { background: var(--hull-2); }
  #settings-btn[aria-expanded="true"] { color: var(--glint); border-color: var(--glint); }

  /* Readouts. Row of label + value, hairline between, digits aligned. */
  #readout { display: flex; flex-direction: column; gap: 6px; padding-top: 9px; border-top: 1px solid var(--rule); }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .v { font-size: 11px; color: var(--spume); font-variant-numeric: tabular-nums; text-align: right; }
  .v.live { color: var(--glint); }
  .v.warn { color: var(--amber); }
  #note { margin: 0; font: 400 10px/1.45 var(--sans); color: var(--amber); }
  #note:empty { display: none; }
  .err { color: var(--coral); }

  :where(button, select):focus-visible {
    outline: 2px solid var(--glint);
    outline-offset: 2px;
  }

  /* The sea is the content and keeps moving; only the panel's transitions go. */
  @media (prefers-reduced-motion: reduce) {
    #backend button { transition: none; }
  }

  @media (max-width: 520px) {
    #hud { width: calc(100vw - 28px); }
  }
</style>

<canvas id="view"></canvas>

<div id="hud" data-collapsed="false">
  <div id="hud-head">
    <h1>Abyssal</h1>
    <button id="toggle" aria-expanded="true" aria-controls="hud" title="Collapse panel">—</button>
  </div>

  <p id="hint">Drag to look · W A S D to move · scroll to zoom · R to ride</p>
  <p id="hint-touch">Hold anywhere for throttle · slide sideways to steer · slide up and down to climb and dive.</p>

  <div id="backend" role="group" aria-label="Renderer backend">
    <button id="btn-auto"   aria-pressed="false" title="Prefer WebGPU, fall back to WebGL2">Auto</button>
    <button id="btn-webgpu" aria-pressed="false" title="Request WebGPU">WebGPU</button>
    <button id="btn-webgl"  aria-pressed="false" title="Force the WebGL2 fallback">WebGL2</button>
  </div>

  <!-- R and V are keys, and a phone has neither. The ride was reachable only
       through the Settings panel, which is a long way to go for the one control
       that changes what the app IS. -->
  <div id="ride-row" role="group" aria-label="Craft">
    <button id="btn-ride" aria-pressed="false" title="Ride the wave runner (R)">Ride</button>
    <button id="btn-fly" aria-pressed="false" title="Take the seaplane out (F)">Fly</button>
    <button id="btn-view" title="Switch between the chase camera and the pilot's own view (V)">Chase</button>
  </div>

  <select id="preset" aria-label="Sea state preset"></select>

  <select id="clouds" aria-label="Cloud type" title="Real cloud genera over the active preset">
    <option value="preset">Clouds · preset’s own</option>
  </select>

  <button id="settings-btn" aria-expanded="false" aria-controls="ui"
    title="Every parameter of the sea and the sky">Settings ›</button>

  <div id="readout">
    <div class="row"><span class="k">Running</span><span class="v" id="status">starting…</span></div>
    <div class="row"><span class="k">Frame</span><span class="v" id="fps">—</span></div>
    <div class="row"><span class="k">Bands</span><span class="v" id="bands">—</span></div>
    <div class="row"><span class="k">Build</span><span class="v" id="build">—</span></div>
  </div>
  <p id="note"></p>
</div>

<!-- The classic demo's full parameter panel (demo/ui.js), docked right, hidden
     until the Settings button opens it. -->
<div id="ui" class="hidden"></div>

<script>
  (function () {
    var hud = document.getElementById('hud');
    var t = document.getElementById('toggle');
    t.addEventListener('click', function () {
      var next = hud.getAttribute('data-collapsed') !== 'true';
      hud.setAttribute('data-collapsed', String(next));
      t.setAttribute('aria-expanded', String(!next));
      t.textContent = next ? '+' : '—';
      t.title = next ? 'Expand panel' : 'Collapse panel';
    });
  })();
</script>

<script>/*__BUNDLE__*/</script>
