<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abyssal — three.js / WebGPU</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080c; overflow: hidden;
               -webkit-text-size-adjust: 100%; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cfe4f5; background: rgba(6,12,20,.74); border: 1px solid #23384c;
    border-radius: 10px; padding: 11px 13px; backdrop-filter: blur(8px);
    width: 15.5rem; max-width: calc(100vw - 24px);
  }
  #hud h1 { margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
            color: #8fb8d8; font-weight: 600; }
  #hint { margin: 4px 0 0; color: #63859f; font-size: 11px; }
  #backend { display: flex; gap: 5px; margin: 9px 0 0; }
  #backend button {
    flex: 1; font: inherit; font-size: 11px; color: #cfe4f5; background: #0e1a26;
    border: 1px solid #2a4257; border-radius: 6px; padding: 5px 4px; cursor: pointer;
    -webkit-appearance: none;
  }
  #backend button:hover { border-color: #3d6a8f; }
  #backend button[aria-pressed="true"] { background: #17364f; border-color: #4d7ea8; color: #eaf4ff; }
  select { font: inherit; font-size: 11px; width: 100%; margin-top: 7px; background: #0e1a26;
           color: #cfe4f5; border: 1px solid #2a4257; border-radius: 6px; padding: 5px 6px;
           -webkit-appearance: none; }
  #status { margin-top: 8px; color: #7fa6c4; font-size: 11px; word-break: break-word; }
  #status b { color: #cfe4f5; font-weight: 600; }
  #fps { margin-top: 3px; color: #55748c; font-size: 11px; }
  .warn { color: #e8b455; }
  .err { color: #e8735a; }
</style>

<canvas id="view"></canvas>

<div id="hud">
  <h1>Abyssal · three.js</h1>
  <p id="hint">WASD / drag to look</p>
  <div id="backend">
    <button id="btn-auto"   aria-pressed="false" title="Prefer WebGPU, fall back to WebGL2">Auto</button>
    <button id="btn-webgpu" aria-pressed="false" title="Require WebGPU">WebGPU</button>
    <button id="btn-webgl"  aria-pressed="false" title="Force the WebGL2 fallback">WebGL2</button>
  </div>
  <select id="preset" aria-label="Preset"></select>
  <div id="status">starting…</div>
  <div id="fps"></div>
</div>

<script>/*__BUNDLE__*/</script>
