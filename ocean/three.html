<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abyssal — three.js / WebGPU</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080c; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe4f5; background: rgba(6,12,20,.72); border: 1px solid #23384c;
    border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px);
    max-width: 42ch;
  }
  #hud h1 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8fb8d8; }
  #backend { display: flex; gap: 6px; margin: 8px 0 2px; }
  #backend button {
    flex: 1; font: inherit; color: #cfe4f5; background: #0e1a26;
    border: 1px solid #2a4257; border-radius: 6px; padding: 5px 8px; cursor: pointer;
  }
  #backend button[aria-pressed="true"] { background: #17364f; border-color: #4d7ea8; color: #eaf4ff; }
  #backend button:disabled { opacity: .45; cursor: not-allowed; }
  #status { margin-top: 6px; color: #7fa6c4; }
  #status b { color: #cfe4f5; font-weight: 600; }
  .warn { color: #e8b455; }
  .err { color: #e8735a; }
  select { font: inherit; width: 100%; margin-top: 6px; background: #0e1a26; color: #cfe4f5;
           border: 1px solid #2a4257; border-radius: 6px; padding: 4px 6px; }
</style>

<canvas id="view"></canvas>

<div id="hud">
  <h1>Abyssal · three.js</h1>
  <div id="backend">
    <button id="btn-auto"   aria-pressed="false" title="Prefer WebGPU, fall back to WebGL2">Auto</button>
    <button id="btn-webgpu" aria-pressed="false" title="Require WebGPU">WebGPU</button>
    <button id="btn-webgl"  aria-pressed="false" title="Force the WebGL2 fallback">WebGL2</button>
  </div>
  <select id="preset"></select>
  <div id="status">starting…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
  "three/webgpu": "https://unpkg.com/three@0.185.1/build/three.webgpu.js",
  "three/tsl": "https://unpkg.com/three@0.185.1/build/three.tsl.js"
} }
</script>

<script type="module">
import { boot, wantedBackend } from './demo/three-main.js';

const statusEl = document.getElementById('status');
const want = wantedBackend();

// The button is a reload, not a hot swap. Switching backend means a new GPU
// device, new pipelines and new render targets for every one of the ~90 passes;
// tearing all of that down live is a large amount of machinery whose only job is
// to avoid a page load. The URL carries the choice, so the state is shareable
// and the two backends are trivially A/B-able.
for (const [id, value] of [['btn-auto', 'auto'], ['btn-webgpu', 'webgpu'], ['btn-webgl', 'webgl']]) {
  const b = document.getElementById(id);
  b.setAttribute('aria-pressed', String(want === value));
  b.addEventListener('click', () => {
    const u = new URL(location.href);
    if (value === 'auto') u.searchParams.delete('backend');
    else u.searchParams.set('backend', value);
    location.href = u.toString();
  });
}

try {
  const app = await boot({ canvas: document.getElementById('view') });

  const sel = document.getElementById('preset');
  for (const name of app.presets) {
    const o = document.createElement('option');
    o.value = o.textContent = name;
    sel.appendChild(o);
  }
  sel.value = 'Golden Hour Swell';
  sel.addEventListener('change', () => app.applyPreset(sel.value));

  const label = app.backend === 'webgpu' ? 'WebGPU' : 'WebGL2';
  statusEl.innerHTML = `running on <b>${label}</b>` +
    (app.fellBack ? ' <span class="warn">(WebGPU unavailable — fell back)</span>' : '');

  // A window handle so the profiler and the console can reach the live app.
  window.abyssal = app;
} catch (e) {
  statusEl.innerHTML = `<span class="err">${String(e.message || e)}</span>`;
  if (want === 'webgpu') {
    statusEl.innerHTML += '<br>Try <b>Auto</b> to fall back to WebGL2.';
  }
  throw e;
}
</script>
