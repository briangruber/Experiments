<!doctype html>
<meta charset="utf-8">
<title>measure dialogue</title>
<script>
// Decode each clip and report its length and a loudness envelope. Run in the
// browser only because it is the one audio decoder available here. Clips are
// passed as { id, url } because they live in more than one directory — the
// shared library and each episode's voice track.
window.__measure = async (clips, hz) => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  const out = [];
  for (const { id, url } of clips) {
    const bytes = await (await fetch(url)).arrayBuffer();
    const buf = await ctx.decodeAudioData(bytes);
    const pcm = buf.getChannelData(0);

    // Trim the silence encoders pad onto both ends, or every line appears to
    // start late and the beak opens on nothing.
    const floor = 0.008;
    let first = 0;
    let last = pcm.length - 1;
    while (first < pcm.length && Math.abs(pcm[first]) < floor) first++;
    while (last > first && Math.abs(pcm[last]) < floor) last--;
    const lead = first / buf.sampleRate;
    const dur = Math.max(0.2, (last - first) / buf.sampleRate);

    // RMS per envelope frame, then normalise to the loudest frame so a quiet
    // line still moves the beak as much as a shouted one.
    const step = Math.max(1, Math.round(buf.sampleRate / hz));
    const frames = [];
    let peak = 0;
    for (let i = first; i <= last; i += step) {
      let sum = 0;
      const end = Math.min(last, i + step);
      for (let j = i; j < end; j++) sum += pcm[j] * pcm[j];
      const rms = Math.sqrt(sum / Math.max(1, end - i));
      frames.push(rms);
      if (rms > peak) peak = rms;
    }
    const env = frames
      .map((v) => Math.min(9, Math.round((v / (peak || 1)) * 9)))
      .join('');

    // Loudness as heard: the hottest 300ms window, which is what a listener
    // judges a line by. Peak alone says nothing — one consonant can hit full
    // scale over a whisper.
    const win = Math.round(buf.sampleRate * 0.3);
    let loud = 0;
    for (let i = first; i <= last; i += Math.round(win / 3)) {
      let sum = 0;
      const end = Math.min(last, i + win);
      for (let j = i; j < end; j++) sum += pcm[j] * pcm[j];
      loud = Math.max(loud, Math.sqrt(sum / Math.max(1, end - i)));
    }
    out.push({ id, dur, lead, peak, loud, env });
  }
  return out;
};

// How deep is a voice? Two numbers that do not need a pitch tracker: the
// spectral centroid (the "brightness" of the whole clip) and the share of
// energy under 300Hz, which is where a chest voice lives.
window.__spectrum = async (clips) => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  const out = [];
  for (const { id, url } of clips) {
    const bytes = await (await fetch(url)).arrayBuffer();
    const buf = await ctx.decodeAudioData(bytes);
    const off = new OfflineAudioContext(1, buf.length, buf.sampleRate);
    const src = off.createBufferSource();
    src.buffer = buf;
    const an = off.createAnalyser();
    an.fftSize = 4096;
    src.connect(an);
    an.connect(off.destination);
    src.start();

    // Sample the spectrum across the clip by rendering in chunks is awkward;
    // instead do a plain DFT-by-bins on windows of the PCM.
    const pcm = buf.getChannelData(0);
    const N = 2048;
    const bins = 64;              // 0..8000Hz in 125Hz steps
    const binHz = 8000 / bins;
    const acc = new Float64Array(bins);
    let windows = 0;
    for (let start = 0; start + N < pcm.length; start += N * 2) {
      // Skip near-silence so pauses do not drag the average down.
      let e = 0;
      for (let i = 0; i < N; i++) e += pcm[start + i] * pcm[start + i];
      if (Math.sqrt(e / N) < 0.01) continue;
      windows++;
      for (let b = 0; b < bins; b++) {
        const f = (b + 0.5) * binHz;
        const w = (2 * Math.PI * f) / buf.sampleRate;
        let re = 0, im = 0;
        for (let i = 0; i < N; i++) {
          const win = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N);
          const v = pcm[start + i] * win;
          re += v * Math.cos(w * i);
          im += v * Math.sin(w * i);
        }
        acc[b] += Math.sqrt(re * re + im * im);
      }
    }
    let total = 0, weighted = 0, low = 0;
    for (let b = 0; b < bins; b++) {
      const f = (b + 0.5) * binHz;
      total += acc[b];
      weighted += acc[b] * f;
      if (f < 300) low += acc[b];
    }
    out.push({ id, windows, centroid: total ? weighted / total : 0, lowShare: total ? low / total : 0 });
  }
  return out;
};
</script>
