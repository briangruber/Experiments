<!doctype html>
<meta charset="utf-8">
<title>measure dialogue</title>
<script>
// Decode each clip and report its length and a loudness envelope. Run in the
// browser only because it is the one audio decoder available here.
window.__measure = async (ids, hz) => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  const out = [];
  for (const id of ids) {
    const bytes = await (await fetch(`/audio/${id}.mp3`)).arrayBuffer();
    const buf = await ctx.decodeAudioData(bytes);
    const pcm = buf.getChannelData(0);

    // Trim the silence encoders pad onto both ends, or every line appears to
    // start late and the beak opens on nothing.
    const floor = 0.008;
    let first = 0;
    let last = pcm.length - 1;
    while (first < pcm.length && Math.abs(pcm[first]) < floor) first++;
    while (last > first && Math.abs(pcm[last]) < floor) last--;
    const lead = first / buf.sampleRate;
    const dur = Math.max(0.2, (last - first) / buf.sampleRate);

    // RMS per envelope frame, then normalise to the loudest frame so a quiet
    // line still moves the beak as much as a shouted one.
    const step = Math.max(1, Math.round(buf.sampleRate / hz));
    const frames = [];
    let peak = 0;
    for (let i = first; i <= last; i += step) {
      let sum = 0;
      const end = Math.min(last, i + step);
      for (let j = i; j < end; j++) sum += pcm[j] * pcm[j];
      const rms = Math.sqrt(sum / Math.max(1, end - i));
      frames.push(rms);
      if (rms > peak) peak = rms;
    }
    const env = frames
      .map((v) => Math.min(9, Math.round((v / (peak || 1)) * 9)))
      .join('');

    out.push({ id, dur, lead, peak, env });
  }
  return out;
};
</script>
