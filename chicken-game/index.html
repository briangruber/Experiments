<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chicken Game</title>
<link rel="stylesheet" href="./src/ui.css">
<canvas id="gl" oncontextmenu="return false"></canvas>
<div id="ui">
  <div id="masthead">
    <div id="title">🐔 CHICKEN GAME</div>
    <div id="counters">
      <span id="egg-counter" title="Eggs collected">🥚 0</span>
      <span id="weird-counter" title="Weird moments witnessed">👁 0</span>
    </div>
  </div>
  <div id="hint">drag · look &nbsp; scroll · zoom &nbsp; tap floor · seeds &nbsp; tap chicken · boo</div>
  <div id="buttons">
    <button id="view" type="button" aria-label="Go outside to the run" title="Switch view">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="v-out" d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/>
        <path class="v-in" d="M3 20h18M6 20V11h5v9M14 20v-5h5v5M4 11l4.5-3.5L13 11"/>
      </svg>
    </button>
    <!-- Drawn rather than set as an emoji: the square-four-corners glyph has
         patchy font coverage, and a missing box in the corner looks broken.
         Hidden until the Fullscreen API is confirmed available. -->
    <button id="fullscreen" type="button" aria-label="Enter full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="fs-in" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
        <path class="fs-out" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>
      </svg>
    </button>
    <button id="mute" type="button" aria-label="Turn sound on">🔇</button>
  </div>
  <!-- Things a viewer can do TO the coop. Shared world state, so in a
       multiplayer coop everyone sees the result of everyone's meddling. -->
  <div id="actions">
    <button id="act-door" type="button" aria-label="Close the pop-hole" title="Open or close the door">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 21V4h9v17z"/>
        <path class="d-swing" d="M13 4l7 2v12l-7 2"/>
        <circle cx="10.5" cy="12.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button id="act-worm" type="button" aria-label="Drop a worm in the run" title="Drop a worm">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 17c2-6 5 2 7-3s4 1 6-1 2-3 3-3"/>
      </svg>
    </button>
    <button id="act-hawk" type="button" aria-label="Send a hawk over the run" title="Hawk!">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M2 9c4-3 7 1 10-2 3 3 6-1 10 2-4 1-6 5-10 5S6 10 2 9z"/>
      </svg>
    </button>
    <button id="act-fox" type="button" aria-label="Send a fox to the coop" title="Fox">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 5l3 4M21 5l-3 4"/>
        <path d="M6 9c2-1 10-1 12 0 1 3-1 7-6 7S5 12 6 9z"/>
        <path d="M10 12h.01M14 12h.01"/>
      </svg>
    </button>
  </div>
  <div id="name-tag"></div>
  <div id="fatal"></div>
</div>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
