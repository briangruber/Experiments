<meta charset="utf-8"><title>cut</title>
<canvas id="c"></canvas>
<script type="module">
// Cut a generated sprite sheet into aligned frames.
//
// The hard part is not finding the frames, it is that adjacent figures touch.
// A model asked for gaps leaves gaps of less than a pixel once the sheet is
// reduced to native resolution, so column-gap detection finds one wide blob,
// and slicing into equal columns instead cuts through the neighbour's coat and
// leaves a sliver of it in every cell.
//
// Neither slicing nor connectivity works alone. Slicing alone leaves a sliver
// of the neighbour's coat in every cell. Connectivity alone is worse: the
// figures touch each other, so a flood from any one of them spans the whole
// sheet and returns a single frame 114 pixels wide.
//
// Together they work. The slice decides WHERE a frame is; a flood-fill from
// the middle of the slice, BOUNDED BY IT, decides what belongs to it. The
// neighbour's sliver is inside the slice but is not connected to the centre
// within it, so it is dropped — and the figure's own raised arm is kept even
// though it reaches the slice edge.
// How much of a character has to be passed, walking up from the bottom of a
// frame, before the row counts as the ground it stands on. Ten pixels is far
// more than background-removal noise and far less than a boot.
// How opaque a pixel has to be to count as the character.
//
// This was 40, and 40 is why the cast wore a dark outline it was never drawn
// with. AutoSprite's background removal returns a feathered edge: measured
// across this cast, 6% to 33% of every silhouette is partial alpha, and its
// mean luminance is well below the figure's own (Pike's rim reads 27 against
// his 82) because those pixels are half background. The packer kept every one
// of them and then wrote it at alpha 255, so a soft rim of dark background
// became a hard opaque line all the way round.
//
// 128 is the midpoint, and the midpoint is the principled place for it: a
// pixel that is more figure than background is figure. The art's own dark
// outline is fully opaque and survives; the half-dissolved rim outside it does
// not. Raising it further starts eating whiskers and rope.
const ALPHA_CUT = 128;
const GROUND_QUOTA = 10;

window.__cut = async (src, opts) => {
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
  });
  const down = opts.down || 1;
  const W = Math.round(img.width / down), H = Math.round(img.height / down);
  const c = document.getElementById('c');
  c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, W, H);
  g.drawImage(img, 0, 0, W, H);

  // Key the background here rather than trusting the generator to have made it
  // flat. Seedream returns a magenta GRADIENT, so a corner-sampled key removes
  // the top half and leaves the bottom, joining every figure along its feet.
  // Magenta is identifiable by relation rather than by value — red and blue
  // both well above green — which holds across a gradient.
  const id = g.getImageData(0, 0, W, H);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], gg = d[i + 1], b = d[i + 2];
    if ((r - gg > opts.keyMargin && b - gg > opts.keyMargin) || (r < 40 && gg < 40 && b < 60)) d[i + 3] = 0;
  }
  g.putImageData(id, 0, 0);
  const A = (x, y) => d[(y * W + x) * 4 + 3];

  const lo = (() => { for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) if (A(x, y) >= ALPHA_CUT) return x; return 0; })();
  const hi = (() => { for (let x = W - 1; x >= 0; x--) for (let y = 0; y < H; y++) if (A(x, y) >= ALPHA_CUT) return x; return W - 1; })();
  const n = opts.frames;
  const step = (hi - lo + 1) / n;

  const frames = [];
  for (let i = 0; i < n; i++) {
    const sx0 = Math.round(lo + i * step), sx1 = Math.round(lo + (i + 1) * step) - 1;
    const seedX = Math.round((sx0 + sx1) / 2);
    // Flood from the whole centre column, so a figure split by a raised arm
    // still comes back in one piece.
    const seen = new Uint8Array(W * H);
    const stack = [];
    for (let y = 0; y < H; y++) {
      for (let sx = seedX - 1; sx <= seedX + 1; sx++) {
        if (sx >= 0 && sx < W && A(sx, y) >= ALPHA_CUT && !seen[y * W + sx]) { seen[y * W + sx] = 1; stack.push(sx, y); }
      }
    }
    let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
    while (stack.length) {
      const y = stack.pop(), x = stack.pop();
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < sx0 || nx > sx1 || ny < 0 || ny >= H) continue;
        const p = ny * W + nx;
        if (seen[p] || A(nx, ny) < ALPHA_CUT) continue;
        seen[p] = 1; stack.push(nx, ny);
      }
    }
    if (x1 < 0) continue;
    // The head centre, not the bounding-box centre: in a walk cycle a swinging
    // arm moves the box without moving the character, so aligning on the box
    // makes the figure slide a few pixels a stride.
    const cxIn = (t0, t1) => {
      let a = 1e9, b = -1;
      const ya = y0 + Math.round((y1 - y0) * t0), yb = y0 + Math.round((y1 - y0) * t1);
      for (let y = ya; y <= yb; y++) for (let x = x0; x <= x1; x++) if (seen[y * W + x]) { if (x < a) a = x; if (x > b) b = x; }
      return b >= a ? (a + b) / 2 : (x0 + x1) / 2;
    };
    const MASK = (px, py) => seen[py * W + px];
      // Where the character stands, as opposed to where its lowest pixel is.
      //
      // Background removal leaves specks: a single opaque pixel below the boot
      // in one frame, eleven in the next. Pinning "the lowest pixel" pins a
      // speck to the same row as a boot toe, and the boots then sit three rows
      // lower in most frames and hop up in the rest — which is what Grout's
      // idle was doing once a loop. So the ground row is the lowest row that
      // carries a real amount of character, found by walking up from the
      // bottom until enough opaque pixels have been passed to be a foot.
      const groundRow = () => {
        let seen = 0;
        for (let y = y1; y >= y0; y--) {
          for (let px = x0; px <= x1; px++) if (MASK(px, y)) seen++;
          if (seen >= GROUND_QUOTA) return y;
        }
        return y1;
      };
      // How wide the figure is just above the ground. Flat across an idle,
      // swinging across a walk — which is how a clip's own frames say whether
      // it has a gait, before anything has been packed.
      const footWidth = () => {
        const band = Math.max(2, Math.round((y1 - y0) * 0.12));
        let a = 1e9, b = -1;
        for (let y = Math.max(y0, y1 - band); y <= y1; y++)
          for (let px = x0; px <= x1; px++) if (MASK(px, y)) { if (px < a) a = px; if (px > b) b = px; }
        return b >= a ? b - a + 1 : 0;
      };
    frames.push({ x0, x1, y0, y1, h: y1 - y0 + 1, groundY: groundRow(), footW: footWidth(),
      headCx: cxIn(0, 0.12), footCx: cxIn(0.92, 1), mask: Array.from(seen) });
  }
  window.__state = { W, H, d: Array.from(d), frames };
  return { w: W, h: H, frames: frames.map(({ mask, ...f }) => f) };
};

// A sheet that already IS a uniform grid needs none of the guessing above.
// AutoSprite returns 5x5 cells of 256px with the background already removed,
// which is the format docs/asset-pack.md asks for — so the cutter's job
// shrinks to measuring where the figure sits inside each cell and re-packing
// it at native resolution with the feet on one row.
window.__grid = async (src, opts) => {
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
  });
  const down = opts.down || 1;
  const W = Math.round(img.width / down), H = Math.round(img.height / down);
  const c = document.getElementById('c');
  c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, W, H);
  g.drawImage(img, 0, 0, W, H);
  const id = g.getImageData(0, 0, W, H), d = id.data;
  // Cut the background the matte left inside the figure.
  //
  // AutoSprite's removal is an alpha matte, and a matte keeps background that
  // the silhouette wraps around: the gap between Grout's boots, the curl of the
  // cat's tail, the notch under its chin. Those came back opaque, in the
  // generator's own light grey, and the cat in particular was wearing grey
  // patches on its tail, chest and legs that its character reference does not
  // have. No removal setting fixes it — `standard` and `basic` are silently the
  // same as `ultra`, and only `none` differs, which returns the frames with the
  // background still on.
  //
  // WHAT DOES NOT WORK, both tried:
  //
  //   Keying the background ourselves from a `none` pull. Fine on Grout, whose
  //   backdrop is flat; useless on Pike, whose is mottled, where a colour key
  //   kept 58% more of his cell than the matte did.
  //
  //   Cutting anything flat, neutral and light. That describes the leftover
  //   and it also describes the light stripes of Pike's shirt and the highlight
  //   down his trouser leg — it punched a hole clean through his leg, 9,628
  //   pixels of him. Requiring the patch to be SEALED (no path to the cell
  //   border) saves him, and loses most of the cat, whose gaps are open at one
  //   end.
  //
  // WHAT WORKS is letting the sheet say what its own background looks like.
  // A sealed patch is reliably background — nothing else is a flat neutral
  // light region with no way out. So: find the sealed patches, take their
  // dominant colour, and then cut the open ones too, but only where they match
  // it. Measured across this cast, sealed and open agree to within 6 on every
  // sheet whose open patches really are background — the cat 0 and 4, Grout 0,
  // Bonny 5 — and disagree by 20 on Pike's despair, where the open patches are
  // his trousers. A tolerance of 12 sits in that gap.
  //
  // A sheet with no sealed patches teaches nothing and loses nothing: it cuts
  // nothing at all, which is the right way round for a pass that deletes parts
  // of a character if it is wrong.
  let holesCut = 0;
  if (opts.cutHoles) {
    const FLAT_SD = 6, NEUTRAL = 10, LIGHT = 120, MIN_PATCH = 8, BG_TOL = 12, LEARN_MIN = 60;
    const cw0 = W / opts.cols, ch0 = H / opts.rows;
    const patches = [];
    for (let r = 0; r < opts.rows; r++) {
      for (let c = 0; c < opts.cols; c++) {
        const bx = Math.round(c * cw0), by = Math.round(r * ch0);
        const bw = Math.round((c + 1) * cw0) - bx, bh = Math.round((r + 1) * ch0) - by;
        const idx = (x, y) => (by + y) * W + bx + x;
        const op = (x, y) => d[idx(x, y) * 4 + 3] >= ALPHA_CUT;
        // The true outside: transparent, and reachable from this cell's border.
        const outside = new Uint8Array(bw * bh);
        const st = [];
        const push = (x, y) => { const p = y * bw + x; if (!outside[p] && !op(x, y)) { outside[p] = 1; st.push(p); } };
        for (let x = 0; x < bw; x++) { push(x, 0); push(x, bh - 1); }
        for (let y = 0; y < bh; y++) { push(0, y); push(bw - 1, y); }
        while (st.length) {
          const p = st.pop(), x = p % bw, y = (p - x) / bw;
          if (x > 0) push(x - 1, y);
          if (y > 0) push(x, y - 1);
          if (x < bw - 1) push(x + 1, y);
          if (y < bh - 1) push(x, y + 1);
        }
        const seen = new Uint8Array(bw * bh);
        for (let y0 = 0; y0 < bh; y0++) {
          for (let x0 = 0; x0 < bw; x0++) {
            const p0 = y0 * bw + x0;
            if (seen[p0] || !op(x0, y0)) continue;
            const i0 = idx(x0, y0) * 4;
            const base = [d[i0], d[i0 + 1], d[i0 + 2]];
            const stack = [p0]; seen[p0] = 1;
            const px = []; let mouth = 0;
            while (stack.length) {
              const p = stack.pop(), x = p % bw, y = (p - x) / bw;
              px.push(p);
              for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                const nx = x + dx, ny = y + dy;
                if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) { mouth++; continue; }
                const np = ny * bw + nx;
                if (outside[np]) { mouth++; continue; }
                if (seen[np] || !op(nx, ny)) continue;
                const i = idx(nx, ny) * 4;
                // Grown by colour, so a patch is one flat thing rather than the
                // whole figure.
                if (Math.max(Math.abs(d[i] - base[0]), Math.abs(d[i + 1] - base[1]),
                  Math.abs(d[i + 2] - base[2])) > 10) continue;
                seen[np] = 1; stack.push(np);
              }
            }
            if (px.length < MIN_PATCH) continue;
            const m = [0, 0, 0];
            for (const p of px) { const i = idx(p % bw, (p - (p % bw)) / bw) * 4; m[0] += d[i]; m[1] += d[i + 1]; m[2] += d[i + 2]; }
            for (let k = 0; k < 3; k++) m[k] /= px.length;
            let sd = 0;
            for (const p of px) {
              const i = idx(p % bw, (p - (p % bw)) / bw) * 4;
              sd += ((d[i] - m[0]) ** 2 + (d[i + 1] - m[1]) ** 2 + (d[i + 2] - m[2]) ** 2) / 3;
            }
            sd = Math.sqrt(sd / px.length);
            const L = 0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2];
            const spread = Math.max(...m) - Math.min(...m);
            if (sd > FLAT_SD || spread > NEUTRAL || L < LIGHT) continue;
            patches.push({ px, idx, bw, sealed: mouth === 0, rgb: m });
          }
        }
      }
    }
    // What this sheet's background looks like, learned from the sealed patches.
    const sealed = patches.filter((p) => p.sealed);
    const sealedPx = sealed.reduce((a, p) => a + p.px.length, 0);
    let bg = null;
    if (sealedPx >= LEARN_MIN) {
      const tally = new Map();
      for (const p of sealed) {
        const k = p.rgb.map((v) => Math.round(v) >> 3).join(',');
        const e = tally.get(k) || { px: 0, r: 0, g: 0, b: 0, n: 0 };
        e.px += p.px.length; e.r += p.rgb[0]; e.g += p.rgb[1]; e.b += p.rgb[2]; e.n++;
        tally.set(k, e);
      }
      let best = null;
      for (const e of tally.values()) if (!best || e.px > best.px) best = e;
      bg = [best.r / best.n, best.g / best.n, best.b / best.n];
    }
    if (bg) {
      for (const p of patches) {
        const far = Math.max(Math.abs(p.rgb[0] - bg[0]), Math.abs(p.rgb[1] - bg[1]), Math.abs(p.rgb[2] - bg[2]));
        if (far > BG_TOL) continue;
        for (const q of p.px) d[p.idx(q % p.bw, (q - (q % p.bw)) / p.bw) * 4 + 3] = 0;
        holesCut += p.px.length;
      }
      window.__bg = bg.map(Math.round);
    }
    if (holesCut) g.putImageData(id, 0, 0);
  }
  if (opts.keyWhite) {
    // The old courtesy key, for sheets that arrive on white.
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] > 244 && d[i + 1] > 244 && d[i + 2] > 244) d[i + 3] = 0;
    }
    g.putImageData(id, 0, 0);
  }
  const A = (x, y) => d[(y * W + x) * 4 + 3];

  const cw = W / opts.cols, ch = H / opts.rows;
  const frames = [];
  for (let r = 0; r < opts.rows; r++) {
    for (let col = 0; col < opts.cols; col++) {
      const bx = Math.round(col * cw), by = Math.round(r * ch);
      const bx1 = Math.round((col + 1) * cw) - 1, by1 = Math.round((r + 1) * ch) - 1;
      let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
      const mask = new Uint8Array(W * H);
      for (let y = by; y <= by1; y++) for (let x = bx; x <= bx1; x++) {
        if (A(x, y) < ALPHA_CUT) continue;
        mask[y * W + x] = 1;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      if (x1 < 0) { continue; }
      // Two candidate anchors, because neither is right for every clip. The
      // head is right for a walk, where a swinging arm moves the bounding box
      // without moving the character. It is WRONG for an idle whose head
      // sways: holding a swaying head still slides the whole body, and what
      // that looks like is a man standing on the spot with shuffling feet —
      // which is exactly what shipped. Measured, Grout's idle has 0.0px of
      // foot movement in the source and 8px of head sway. The cutter picks
      // per clip, in sheet-cut.mjs, by which band is steadier.
      const cxIn = (t0, t1) => {
        let a = 1e9, b = -1;
        const ya = y0 + Math.round((y1 - y0) * t0), yb = y0 + Math.round((y1 - y0) * t1);
        for (let y = ya; y <= yb; y++) for (let x = x0; x <= x1; x++) if (mask[y * W + x]) { if (x < a) a = x; if (x > b) b = x; }
        return b >= a ? (a + b) / 2 : (x0 + x1) / 2;
      };
      const MASK = (px, py) => mask[py * W + px];
      // Where the character stands, as opposed to where its lowest pixel is.
      //
      // Background removal leaves specks: a single opaque pixel below the boot
      // in one frame, eleven in the next. Pinning "the lowest pixel" pins a
      // speck to the same row as a boot toe, and the boots then sit three rows
      // lower in most frames and hop up in the rest — which is what Grout's
      // idle was doing once a loop. So the ground row is the lowest row that
      // carries a real amount of character, found by walking up from the
      // bottom until enough opaque pixels have been passed to be a foot.
      const groundRow = () => {
        let seen = 0;
        for (let y = y1; y >= y0; y--) {
          for (let px = x0; px <= x1; px++) if (MASK(px, y)) seen++;
          if (seen >= GROUND_QUOTA) return y;
        }
        return y1;
      };
      // How wide the figure is just above the ground. Flat across an idle,
      // swinging across a walk — which is how a clip's own frames say whether
      // it has a gait, before anything has been packed.
      const footWidth = () => {
        const band = Math.max(2, Math.round((y1 - y0) * 0.12));
        let a = 1e9, b = -1;
        for (let y = Math.max(y0, y1 - band); y <= y1; y++)
          for (let px = x0; px <= x1; px++) if (MASK(px, y)) { if (px < a) a = px; if (px > b) b = px; }
        return b >= a ? b - a + 1 : 0;
      };
      // The cell's own origin travels with the frame. A sheet that is already
      // a uniform grid came out of ONE video, so every frame is drawn in the
      // same coordinate frame and its position inside its cell is the truth —
      // which means the atlas can preserve it rather than re-deriving it.
      frames.push({ x0, x1, y0, y1, h: y1 - y0 + 1, cellX: bx, cellY: by,
        groundY: groundRow(), footW: footWidth(),
        headCx: cxIn(0, 0.12), footCx: cxIn(0.92, 1), mask: Array.from(mask) });
    }
  }
  // Several sheets can be packed into one atlas — idle and walk are separate
  // exports but one character — so each source appends to a shared list along
  // with its own pixels, rather than replacing the last one.
  window.__state ??= { sources: [], frames: [] };
  const src_i = window.__state.sources.length;
  window.__state.sources.push({ W, H, d: Array.from(d) });
  for (const f of frames) window.__state.frames.push({ ...f, src: src_i });
  return { w: W, h: H, holesCut, frames: frames.map(({ mask, ...f }) => f) };
};

window.__pack = (cell, out) => {
  const { sources, frames } = window.__state;
  const c = document.getElementById('c');
  c.width = cell.w * out.cols;
  c.height = cell.h * Math.ceil(frames.length / out.cols);
  const g = c.getContext('2d', { willReadFrequently: true });
  const dest = g.createImageData(c.width, c.height);
  frames.forEach((f, i) => {
    const cx = (i % out.cols) * cell.w, cy = ((i / out.cols) | 0) * cell.h;
    // Both alignment rules, enforced rather than hoped for: feet to one row,
    // and the frame's chosen anchor to one column, in every cell. Which anchor
    // that is was decided per clip by whichever band moves least in the source
    // — see __grid.
    // Both alignment rules for a sheet that needs them: feet to one row, and
    // the frame's chosen anchor to one column.
    const anchor = f.anchor === 'foot' ? f.footCx : f.headCx;
    const ox = Math.round(cx + cell.w / 2 - (anchor - f.x0)) - f.x0;
    const oy = Math.round(cy + out.feetY - (f.groundY - f.y0) - 1) - f.y0;
    // ...and none of them for a sheet that does not.
    //
    // Everything above exists to rescue frames that were never in register
    // with each other. A sheet extracted from one video already is: each
    // frame's position inside its cell is exactly where the animator put it,
    // and re-deriving it from the pixels can only add error. It did — wherever
    // background removal left a soft smear under the boots the detected ground
    // row wandered, and frames that were in register came out bobbing. Which
    // case a sheet is in is measured in sheet-cut.mjs, not assumed.
    const inX = out.inPlace ? cx - f.cellX + (f.inOX || 0) : ox;
    const inY = out.inPlace ? cy - f.cellY + (f.inOY || 0) : oy;
    const { W, d } = sources[f.src || 0];
    for (let y = f.y0; y <= f.y1; y++) {
      for (let x = f.x0; x <= f.x1; x++) {
        if (!f.mask[y * W + x]) continue;
        const dx = x + inX, dy = y + inY;
        if (dx < 0 || dy < 0 || dx >= c.width || dy >= c.height) continue;
        const s = (y * W + x) * 4, t = (dy * c.width + dx) * 4;
        dest.data[t] = d[s]; dest.data[t + 1] = d[s + 1]; dest.data[t + 2] = d[s + 2]; dest.data[t + 3] = 255;
      }
    }
  });
  g.putImageData(dest, 0, 0);
  return c.toDataURL('image/png');
};
// Measure the atlas that was just written, rather than trusting the packer.
// The two rules this tool exists to enforce are checkable in one pass, and a
// tool that enforces a rule without checking it is a tool that will one day
// stop enforcing it quietly.
window.__verify = async (src, cell, cols, count) => {
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
  });
  const c = document.getElementById('c');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const A = (x, y) => d[(y * c.width + x) * 4 + 3];
  const feet = [], heads = [], toes = [];
  for (let i = 0; i < count; i++) {
    const bx = (i % cols) * cell.w, by = ((i / cols) | 0) * cell.h;
    let bot = -1, top = 1e9, x0 = 1e9, x1 = -1;
    for (let y = by; y < by + cell.h; y++) for (let x = bx; x < bx + cell.w; x++) {
      if (A(x, y) < ALPHA_CUT) continue;
      if (y > bot) bot = y; if (y < top) top = y;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
    }
    if (bot < 0) continue;
    // Measured the same way the packer aligned it: the row where enough of the
    // character has been passed to be a foot. Checking the lowest pixel
    // instead reported perfect alignment on an atlas whose boots bobbed three
    // rows, because the lowest pixel was sometimes a single speck.
    let seenPx = 0, ground = bot;
    for (let y = bot; y >= top; y--) {
      for (let x = bx; x < bx + cell.w; x++) if (A(x, y) >= ALPHA_CUT) seenPx++;
      if (seenPx >= 10) { ground = y; break; }
    }
    feet.push(ground - by);
    const cxIn = (t0, t1) => {
      let a = 1e9, b = -1;
      const ya = top + Math.round((bot - top) * t0), yb = top + Math.round((bot - top) * t1);
      for (let y = ya; y <= yb; y++) for (let x = bx; x < bx + cell.w; x++) if (A(x, y) >= ALPHA_CUT) { if (x < a) a = x; if (x > b) b = x; }
      return b >= a ? Math.round((a + b) / 2) - bx : Math.round(cell.w / 2);
    };
    heads.push(cxIn(0, 0.12));
    toes.push(cxIn(0.92, 1));
  }
  const sp = (a) => a.length ? Math.max(...a) - Math.min(...a) : 0;
  // Both column spreads are reported. Only the anchored one can be zero by
  // construction, and the other is the interesting number: it is how far the
  // unanchored end of the character travels, which for an idle should also be
  // small and for a walk should not.
  return { cells: feet.length, feetSpread: sp(feet), headSpread: sp(heads), toeSpread: sp(toes) };
};
// How many frames make one cycle?
//
// A generated walk is a video sampled at a fixed rate, not a cycle authored to
// a frame count, so 25 frames may hold two strides. Playing all of them across
// one stride of travel runs the legs at whatever multiple that happens to be.
//
// The obvious measure — difference every frame against the first and find where
// the picture comes back — does not work, and failed in a way worth recording.
// At low resolution it answered 12, correctly. At full resolution it answered
// 23, because hair and coat folds differ between the first stride and the
// second even when the legs repeat exactly, so the best whole-frame match
// becomes the loop point rather than the gait period. A measure that changes
// its answer with resolution is measuring the wrong thing.
//
// Foot separation is the right thing: the width of the figure in the band just
// above the ground. It is wide at contact, narrow at pass, and peaks once per
// STEP — so twice per stride — regardless of what the coat is doing.
window.__period = async (src, cell, cols, clip, feetY, figureH) => {
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
  });
  const c = document.getElementById('c');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0);

  const band = Math.max(2, Math.round(figureH * 0.12));
  const sep = [];
  for (let k = 0; k < clip.count; k++) {
    const f = clip.start + k;
    const bx = (f % cols) * cell.w, by = ((f / cols) | 0) * cell.h;
    const d = g.getImageData(bx, by + feetY - band, cell.w, band).data;
    let lo = 1e9, hi = -1;
    for (let y = 0; y < band; y++) for (let x = 0; x < cell.w; x++) {
      if (d[(y * cell.w + x) * 4 + 3] >= ALPHA_CUT) { if (x < lo) lo = x; if (x > hi) hi = x; }
    }
    sep.push(hi < 0 ? 0 : hi - lo + 1);
  }

  const max = Math.max(...sep) || 1;
  const min = Math.min(...sep);
  // How far one cycle carries the character, in source pixels.
  //
  // The first version of this doubled the swing in foot separation, on the
  // reasoning that the widest the feet get is a step plus a foot and the
  // narrowest is a foot. That is a model, and it disagreed with itself by 28%
  // between two cuts of the same art.
  //
  // This measures the thing itself. While a foot is on the ground it does not
  // move on the dock, so in the sprite's own frame it slides BACKWARD at
  // exactly the rate the ground goes past — and a run of consecutive backward
  // steps in the rearmost contact pixel IS a stance. The mean of the longest
  // such run is that rate; times the cycle length it is the stride.
  //
  // Two details matter. Only pixels within a few rows of the ground count: a
  // running figure in mid-air trails a leg behind it that sweeps back far
  // faster than the dock does, and counting that read Bonny's stride as two
  // and a quarter body heights. And a STANCE is a consecutive run, not a
  // pooled set of backward frames, for the same reason.
  // A tight band, because the rearmost CONTACT pixel is the point that is
  // actually standing still. Widen it and you start tracking the ankle, which
  // is swinging over the foot rather than resting on the dock, and the slope
  // comes out a quarter too steep.
  const contact = Math.max(2, Math.round(figureH * 0.02));
  const rear = [];
  for (let k = 0; k < clip.count; k++) {
    const f = clip.start + k;
    const bx = (f % cols) * cell.w, by = ((f / cols) | 0) * cell.h;
    const dd = g.getImageData(bx, by + feetY - contact, cell.w, contact).data;
    let lo = -1;
    for (let x = 0; x < cell.w && lo < 0; x++) {
      for (let y = 0; y < contact; y++) if (dd[(y * cell.w + x) * 4 + 3] >= ALPHA_CUT) { lo = x; break; }
    }
    rear.push(lo < 0 ? null : lo);
  }
  // The widest the two CONTACT points ever get: one foot planted at the back
  // and one planted at the front is a step, and a cycle here is a step. It is
  // a floor on the stride, not the estimate itself, because a run has flight
  // phases that carry the character further than the feet ever separate.
  //
  // The floor exists because the slope estimate is not reliable enough to
  // stand alone. Measured across this cast, the widest contact spread is a
  // near-constant fraction of the figure — 0.39, 0.44, 0.44 of standing height
  // for three different people, which is what you would expect of three people
  // walking. The slope over the same three came out 0.35, 0.51 and 0.24. The
  // last of those is Bonny, and a stride read a half short is not a cosmetic
  // error: the engine advances the cycle by distance travelled, so it ran her
  // legs at twice the rate the ground was moving under them.
  let contactSpread = 0;
  for (let k = 0; k < clip.count; k++) {
    const f = clip.start + k;
    const bx = (f % cols) * cell.w, by = ((f / cols) | 0) * cell.h;
    const dd = g.getImageData(bx, by + feetY - contact, cell.w, contact).data;
    let lo = 1e9, hi = -1;
    for (let y = 0; y < contact; y++) for (let x = 0; x < cell.w; x++) {
      if (dd[(y * cell.w + x) * 4 + 3] >= ALPHA_CUT) { if (x < lo) lo = x; if (x > hi) hi = x; }
    }
    if (hi > lo) contactSpread = Math.max(contactSpread, hi - lo + 1);
  }

  const runs = [];
  let cur = [];
  for (let i = 1; i < rear.length; i++) {
    const a = rear[i - 1], b = rear[i];
    if (a != null && b != null && b < a) cur.push(a - b);
    else { if (cur.length) runs.push(cur); cur = []; }
  }
  if (cur.length) runs.push(cur);
  runs.sort((p, q) => q.length - p.length);
  const best = runs[0] || [];
  const slope = best.length ? best.reduce((x, v) => x + v, 0) / best.length : 0;
  // An idle has no gait: the feet barely move, so the separation signal is
  // flat and every ripple in it reads as a peak. Requiring a real swing before
  // trusting the peaks is what stops a standing pose being told it strides
  // every six frames.
  const swing = (max - min) / max;
  if (swing < 0.3) return { period: clip.count, peaks: 0, stride: 0, signal: `flat (swing ${(swing * 100).toFixed(0)}%)` };
  const peaks = [];
  for (let i = 0; i < sep.length; i++) {
    const prev = sep[(i - 1 + sep.length) % sep.length], next = sep[(i + 1) % sep.length];
    if (sep[i] >= prev && sep[i] >= next && sep[i] > max * 0.7) {
      if (!peaks.length || i - peaks[peaks.length - 1] >= 3) peaks.push(i);
    }
  }
  if (peaks.length >= 2) {
    let gap = 0;
    for (let i = 1; i < peaks.length; i++) gap += peaks[i] - peaks[i - 1];
    const perStep = gap / (peaks.length - 1);
    const period = Math.max(2, Math.round(perStep * 2));
    const fromSlope = Math.round(slope * period);
    return { period, peaks: peaks.length,
      stride: Math.max(fromSlope, contactSpread),
      fromSlope, floor: contactSpread,
      stance: best.length, signal: 'foot separation' };
  }
  // A clip with no gait — an idle — has no peaks to count, and its cycle is
  // simply its own length.
  return { period: clip.count, peaks: peaks.length, stride: 0, signal: 'none (whole clip)' };
};

window.__ready = true;
</script>
